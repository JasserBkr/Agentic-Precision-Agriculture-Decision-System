[theme]
base = "light"
primaryColor = "#2D5A3D"
backgroundColor = "#FDFCF9"
secondaryBackgroundColor = "#F4F1E8"
textColor = "#1A2418"
font = "sans serif"

# Disable the auto-reload file watcher. Streamlit's watcher iterates over
# every module in sys.modules doing hasattr(m, "__path__") for hot-reload;
# transformers' lazy-import stub modules (e.g.
# transformers.models.sam2.image_processing_sam2) resolve vision-only code
# on that attribute access, triggering a No module named 'torchvision'
# warning for each — a wall of noise, even though the app never uses those
# models. The app is NOT crashing; this just silences the watcher. Tradeoff:
# code changes now require a manual browser refresh instead of auto-reload.
[server]
fileWatcherType = "none"
