
[project]
name = "agri-agent"
version = "0.1.0"
description = "Agentic geospatial reasoning system for precision-agriculture decision support (DeepShift AI Summer Internship 2026, Project 12)"
requires-python = ">=3.11"
dependencies = [
    # --- Data access ---
    "pystac-client>=0.8",
    "geemap>=0.32",
    "earthengine-api>=1.0",
    "requests>=2.31",
    "requests-oauthlib>=2.0",
    "oauthlib>=3.2",
    "python-dotenv>=1.0",
 
    # --- Geospatial / array processing ---
    "xarray>=2024.3",
    "rasterio>=1.3",
    "geopandas>=0.14",
 
    # --- Forecasting ---
    # chronos-forecasting and torch pinned loosely; confirm exact versions
    # against the Chronos-2 release notes before Week 3.
    "chronos-forecasting",
    "torch",
    "neuralforecast>=1.7",
    "statsmodels>=0.14",
    "pyarrow",
    "pandas>=2.2",
    "numpy>=1.26",
 
    # --- Agent ---
    "langgraph>=0.2",
    "langchain>=0.2",
    "langchain-openai",
    "langchain-google-genai",
    "langchain-groq",
 
    # --- Dashboard ---
    "streamlit>=1.35",
    "folium>=0.16",
    "streamlit-folium>=0.20",
 
    # --- Dev / testing ---
    "pytest>=8.0",
    "pyyaml>=6.0",
]
 
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.hatch.build.targets.wheel]
packages = ["src/agri_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# generate_diagnostic_plots.py deliberately manipulates sys.path before its
# imports so it can be executed directly as a standalone script.
"scripts/generate_diagnostic_plots.py" = ["E402"]
